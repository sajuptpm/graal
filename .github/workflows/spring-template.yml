name: Weekly Spring Tests

on:
  workflow_call:
    inputs:
      NATIVE_IMAGE_OPTIONS:
        required: false
        type: string

env:
  JAVA_HOME: ${{ github.workspace }}/graalvm # identical to the one in ./.github/workflows/build-graalvm
  SPRING_PETCLINIC_PATH: ${{ github.workspace }}/spring-petclinic
  NATIVE_IMAGE_OPTIONS: ${{ inputs.NATIVE_IMAGE_OPTIONS }}

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build-graalvm:
    uses: ./.github/workflows/build-graalvm.yml
  build-and-test-spring:
    name: Native Tests
    needs: build-graalvm
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    if: (github.event_name == 'schedule' && (github.repository == 'oracle/graal' || github.repository == 'sajuptpm/graal')) || (github.event_name != 'schedule')
    steps:
    - name: Checkout oracle/graal
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Download GraalVM
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ needs.build-graalvm.outputs.artifact-name }}
    - name: Extract GraalVM build and use it as JAVA_HOME
      run: |
        tar -xzf ${{ needs.build-graalvm.outputs.artifact-file-name }} -C ${{ github.workspace }}
        echo "JAVA_HOME=${{ github.workspace }}/${{ needs.build-graalvm.outputs.artifact-name }}" >> ${GITHUB_ENV}
    - name: Checkout spring-projects/spring-petclinic
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        repository: spring-projects/spring-petclinic
        path: ${{ env.SPRING_PETCLINIC_PATH }}
    - name: Run nativeTest in spring-petclinic${{ inputs.NATIVE_IMAGE_OPTIONS && format(' with ''{0}''', inputs.NATIVE_IMAGE_OPTIONS) || '' }}
      run: |
        cd ${{ env.SPRING_PETCLINIC_PATH }}
        python3 -c "import re; p = 'build.gradle'; t = open(p).read(); t = re.sub(r'id .org\.cyclonedx\.bom.*?\n', '', t); t = re.sub(r'cyclonedxBom\s*\{.*?\n\}', '', t, flags=re.DOTALL); t = re.sub(r'tasks\.named\(.cyclonedxDirectBom.\)\.configure\s*\{.*?\n\}', '', t, flags=re.DOTALL); open(p, 'w').write(t)"
        python3 -c "open('build.gradle', 'a').write('\ngraalvmNative { binaries { all { buildArgs.add(\"-H:ReflectionConfigurationFiles=\" + file(\"reflect-config.json\").absolutePath) } } }\n')"
        mkdir -p src/main/resources/META-INF/native-image/org.springframework.samples/spring-petclinic src/test/resources/META-INF/native-image/org.springframework.samples/spring-petclinic src/main/resources/META-INF/native-image src/test/resources/META-INF/native-image
        python3 -c "import json; classes=['org.thymeleaf.expression.Numbers','org.thymeleaf.expression.Strings','org.thymeleaf.expression.Temporals','org.thymeleaf.expression.Lists','org.thymeleaf.expression.Dates','org.thymeleaf.expression.Calendars','org.thymeleaf.expression.Bools','org.thymeleaf.expression.Arrays','org.thymeleaf.expression.Sets','org.thymeleaf.expression.Maps','org.thymeleaf.expression.Aggregates','org.thymeleaf.expression.Messages','org.thymeleaf.expression.Ids','org.thymeleaf.expression.Uris','org.thymeleaf.expression.Conversions','org.thymeleaf.expression.ExecutionInfo','org.springframework.samples.petclinic.owner.Owner','org.springframework.samples.petclinic.owner.Pet','org.springframework.samples.petclinic.owner.PetType','org.springframework.samples.petclinic.vet.Vet','org.springframework.samples.petclinic.vet.Specialty','org.springframework.samples.petclinic.visit.Visit']; cfg=[{'name': c, 'allDeclaredConstructors': True, 'allPublicConstructors': True, 'allDeclaredMethods': True, 'allPublicMethods': True, 'queryAllDeclaredMethods': True, 'allDeclaredFields': True, 'allPublicFields': True} for c in classes]; [open(p, 'w').write(json.dumps(cfg, indent=2)) for p in ['reflect-config.json', 'src/main/resources/META-INF/native-image/reflect-config.json', 'src/test/resources/META-INF/native-image/reflect-config.json', 'src/main/resources/META-INF/native-image/org.springframework.samples/spring-petclinic/reflect-config.json', 'src/test/resources/META-INF/native-image/org.springframework.samples/spring-petclinic/reflect-config.json']]"
        ./gradlew nativeTest
